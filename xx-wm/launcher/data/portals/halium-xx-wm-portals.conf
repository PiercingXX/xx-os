# XX-WM portal preferences on Halium (libhybris) phones, installed by
# install.sh to /etc/xdg/xdg-desktop-portal/ over the packaged
# xx-wm-portals.conf. xdg-desktop-portal-wlr exits at start on the
# hwcomposer phoc ("Compositor supports neither ext_image_copy_capture or
# wlr_screencopy"), and the broker waits 25 s on its D-Bus activation for
# Screenshot and again for ScreenCast before it serves anything else, so
# apps launched in the first 50 s time out on Settings. Neither works
# there, so neither is asked for.
[preferred]
default=gtk;
org.freedesktop.impl.portal.Screenshot=none;
org.freedesktop.impl.portal.ScreenCast=none;
